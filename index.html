<!doctype html>
<!-- Permanent compatibility stub (HX8): Holy moved to /holy/. GitHub
     Pages project sites cannot emit a server-side 301, so canonical,
     instant meta refresh and location.replace work together. Keep this
     project online for shipped app versions and old links. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holy has moved</title>
    <meta http-equiv="refresh" content="0; url=https://armandojimenez.dev/holy/" />
    <link rel="canonical" href="https://armandojimenez.dev/holy/" />
    <meta name="robots" content="noindex, follow" />
    <script>
      const destination = new URL('https://armandojimenez.dev/holy/');
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
  </head>
  <body>
    <p><a href="https://armandojimenez.dev/holy/">Holy has moved here.</a></p>
  </body>
</html>
